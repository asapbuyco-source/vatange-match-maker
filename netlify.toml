[build]
  publish = "dist"
  command = "npm run build"

# SPA fallback — sends all routes to index.html so React Router works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (lightweight — CSP omitted to avoid blocking app assets)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-term caching for hashed static assets (safe — filenames change on rebuild)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
